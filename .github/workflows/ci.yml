name: CI

# No caches: each run installs its tools and checks the committed source.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      A3D_TEST_TIMEOUT: '1800'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v2
        id: chromium
        with:
          chrome-version: latest
          install-dependencies: true
      - name: Install Python and PDF dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended tex-gyre poppler-utils
      - name: Prepare browser and scratch directories
        env:
          CHROMIUM_BINARY: ${{ steps.chromium.outputs.chrome-path }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/scratch" "$HOME/tmp"
          ln -s "$CHROMIUM_BINARY" "$RUNNER_TEMP/bin/chromium"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "TMPDIR=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
          echo "AIRSHIPS_TMPDIR=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"
          echo "A3D_CHROME_PROFILE=$RUNNER_TEMP/scratch/3d-profile" >> "$GITHUB_ENV"
          node --version
          "$CHROMIUM_BINARY" --version
      # check_ci_parity.py reads this command as YAML and compares its ordered goals
      # to Makefile's check prerequisites. Keep it a literal make invocation.
      - name: Every make check gate
        id: check-gates
        run: >-
          make --keep-going ciparity portcheck lint stampcheck figfresh fallbackcheck seasoncheck capturecheck guardcheck exercisecheck evaccheck
          labelledcheck figcheck
          analysischeck analysisfresh ledgercheck censuscheck ledgercheck-selftest floatpagecheck cellparity skincheck explorercheck levelscheck shipcheck bandcheck
          nodescheck contractcheck assemblycheck pdfcheck golden test test-node firstparty
          interaction readmecheck noticecheck mutationcheck buildercheck
