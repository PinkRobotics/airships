# Blank issues stay ON. A template exists to make a good report easier to write, not to
# stop someone reporting a real problem because their problem has no template. Anyone who
# has found something wrong should be able to say so in a text box.
blank_issues_enabled: true

contact_links:
  - name: Question about how the model works
    url: https://github.com/pinkai-ca/airships/discussions
    about: >-
      Not a defect claim — "why is it done this way", "what does this figure mean", "would
      X change the answer". The concept page answers many of these; discussions are for the
      ones it does not.

  - name: Read the model first
    url: https://github.com/pinkai-ca/airships/tree/main/sim
    about: >-
      Fifteen modules, no DOM and no network, and every published number is computed in
      one of them. If your question is what a figure is made of, the source is faster than
      we are.

  - name: Where the wildfire data comes from
    url: https://github.com/pinkai-ca/airships/blob/main/DATA-SOURCES.md
    about: >-
      The fire data is real and live and belongs to the agencies that publish it. The fleet
      is imagined. If your question is about the data rather than the aircraft, start here.
