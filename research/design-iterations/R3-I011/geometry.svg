<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1060" role="img" aria-labelledby="title desc">
<title id="title">R3-I011 two-column X-web and erection saddle: failed represented design</title>
<desc id="desc">An equal-scale endpoint plan shows outer j to inner j plus or minus two. The web families occupy axial planes 400 mm apart. Separate dimensioned schematics show both-end hardware and a saddle with a failed 3 mm jaw.</desc>
<rect x="0" y="0" width="1300" height="1060" rx="0" fill="#f6f8fb" stroke="#f6f8fb"/>
<text x="30" y="36" font-family="sans-serif" font-size="23" fill="#172b45" font-weight="bold">R3-I011 · 80 m capsule · SF1.2 · one explicit X-web and attachment design</text>
<text x="30" y="62" font-family="sans-serif" font-size="17" fill="#9a2631" font-weight="normal">FAIL: mass balance, ring-cuff transfer and erection jaw. Global stability and physical confidence UNKNOWN.</text>
